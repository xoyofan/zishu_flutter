name: zishu_flutter
description: "紫薯直播 Flutter 客户端：核心解析、平台适配与 Windows/Web UI 宿主分层。"
publish_to: 'none'
version: 1.0.3-beta

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  live_parser:
    path: packages/live_parser
  speech2zh:
    path: packages/speech2zh
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  shared_preferences: ^2.3.2
  shared_preferences_platform_interface: ^2.4.1
  dio: ^5.7.0
  get: ^4.7.2
  video_player: ^2.9.2
  web_socket_channel: ^3.0.1
  web: ^1.1.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  window_manager: ^0.4.0
  # 窗口防闪窗保护(lib/src/platforms/windows/window_flash_guard.dart)用
  # dart:ffi 直调 user32/dwmapi;calloc/Utf16 助手来自本包(此前仅传递依赖)。
  ffi: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/ui/logo/
    - assets/ui/icons/
    - assets/ui/platform-icons/
    # 聊天徽章本地资产(SFVideoLive 官方样式;目录声明不递归,子目录逐个列出):
    - assets/badges/
    - assets/badges/bilibili/
    - assets/badges/douyin/
    - assets/badges/douyin/fans/
    - assets/badges/douyin/honor/
    - assets/badges/douyu/fans/
    - assets/badges/huya/fans/v2/
    - assets/badges/huya/vip/v2/
    - assets/badges/soop/
    - assets/badges/twitch/

  # Font Awesome Free 6 (Solid):仅供 web 真源也用 FA 的平台统计图标
  # (crown / gem / eye,见 lib/src/shared/presentation/app_icons.dart)。
  # 字体为 Font Awesome Free,许可见 assets/fonts/LICENSE-fontawesome.txt。
  # Flutter 构建时会按使用到的字形做 tree-shaking,发布包只含这几个字形。
  fonts:
    - family: FontAwesome
      fonts:
        - asset: assets/fonts/fa-solid-900.ttf
